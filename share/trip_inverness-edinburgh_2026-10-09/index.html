<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inverness–Edinburgh Roadtrip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F2F5F1; --surface:#FFFFFF; --ink:#17231D; --muted:#56655D; --line:#D6DDD7;
  --sea:#D9E6EC; --land:#F9FAF6; --coast:#8EA7B1; --seaink:#54737F;
  --d1:#0E7C6B; --on-d1:#FFFFFF; --d2:#A65409; --on-d2:#FFFFFF; --ov:#7A3E9D; --on-ov:#FFFFFF;
  --link:#0B6A5C; --hl:#FFF3C4;
  --warn-bg:#FFF4E0; --warn-line:#E2B45A; --warn-ink:#5B3A00;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1512; --surface:#171F1B; --ink:#E6EEE9; --muted:#9DAEA4; --line:#2A352F;
    --sea:#14232B; --land:#1B2520; --coast:#4A6470; --seaink:#7FA0AD;
    --d1:#3DC2AA; --on-d1:#06201A; --d2:#EBA24B; --on-d2:#2B1600; --ov:#C595E4; --on-ov:#26102F;
    --link:#6FD8C3; --hl:#3A3312;
    --warn-bg:#2B2210; --warn-line:#6E551C; --warn-ink:#F2D9A0;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1512; --surface:#171F1B; --ink:#E6EEE9; --muted:#9DAEA4; --line:#2A352F;
  --sea:#14232B; --land:#1B2520; --coast:#4A6470; --seaink:#7FA0AD;
  --d1:#3DC2AA; --on-d1:#06201A; --d2:#EBA24B; --on-d2:#2B1600; --ov:#C595E4; --on-ov:#26102F;
  --link:#6FD8C3; --hl:#3A3312;
  --warn-bg:#2B2210; --warn-line:#6E551C; --warn-ink:#F2D9A0;
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
a{color:var(--link);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
.page{max-width:1320px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:22px 56px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;justify-content:space-between;padding-bottom:18px}
.kicker{margin:0 0 6px;font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font:700 clamp(2rem,4.4vw,3rem)/1.02 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--muted);max-width:62ch;text-wrap:pretty}
.tools{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;padding:7px 13px;font:500 13px/1 var(--f-mono);letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.seg button:focus-visible,.printbtn:focus-visible,.chip:focus-visible,.mk:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.printbtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font:500 13px/1 var(--f-mono);cursor:pointer}

/* glance */
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));border-block:1px solid var(--line);margin-bottom:26px}
.glance>div{padding:14px 16px 14px 0}
.glance>div+div{padding-left:16px;border-left:1px solid var(--line)}
.glance .lbl{display:flex;align-items:center;gap:8px;font:500 12px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.glance .val{margin-top:8px;font:500 16px/1.25 var(--f-mono);font-variant-numeric:tabular-nums}
.glance .val small{display:block;margin-top:3px;font:400 12.5px/1.35 var(--f-body);color:var(--muted)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,430px);gap:0 36px;align-items:start}
.mapcol{grid-column:2;grid-row:1}
.content{grid-column:1;grid-row:1;min-width:0}
.mapwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 13px/1 var(--f-body);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.mapsvg{display:block;margin-inline:auto;height:min(76vh,760px);width:auto;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--sea)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.mapnote{margin:8px 0 0;font-size:12px;color:var(--muted)}

/* map svg */
.sea{fill:var(--sea)} .land{fill:var(--land);stroke:var(--coast);stroke-width:1;stroke-linejoin:round}
.ness{fill:none;stroke:var(--sea);stroke-width:4;stroke-linecap:round}
.seaTxt{font:italic 500 13px var(--f-body);fill:var(--seaink);letter-spacing:.04em}
.regTxt{font:500 11px var(--f-mono);fill:var(--coast);letter-spacing:.22em}
.lbl2{font:600 14.5px var(--f-body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:4.5px;stroke-linejoin:round}
.lbl2.opt{font-weight:500;fill:var(--muted)}
.lbl2.big{font:700 16px var(--f-display)}
.casing{fill:none;stroke:var(--land);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.seg-d1,.seg-d2{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .15s,opacity .15s}
.seg-d1{stroke:var(--d1)} .seg-d2{stroke:var(--d2)}
.seg-sp{fill:none;stroke:var(--ov);stroke-width:3;stroke-linecap:round;stroke-dasharray:7 6;transition:stroke-width .15s,opacity .15s}
.seg-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
.sel-on .seg-d1,.sel-on .seg-d2,.sel-on .seg-sp{opacity:.4}
.sel-on .seg-d1.hi,.sel-on .seg-d2.hi{opacity:1;stroke-width:7}
.sel-on .seg-sp.hi{opacity:1;stroke-width:5}
.mk{cursor:pointer}
.mk .shape-d1{fill:var(--d1)} .mk .shape-d2{fill:var(--d2)} .mk .shape-ov{fill:var(--ov)}
.mk .ring{fill:none;stroke:var(--land);stroke-width:2.5}
.mk .num{font:500 13px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mk .num.d1{fill:var(--on-d1)} .mk .num.d2{fill:var(--on-d2)} .mk .num.ov{fill:var(--on-ov)}
.mk .opt-shape{fill:var(--land);stroke:var(--muted);stroke-width:2;stroke-dasharray:3 2}
.mk .end{fill:var(--land);stroke:var(--ink);stroke-width:3.5}
.sel-on .mk{opacity:.5}
.sel-on .mk.hi{opacity:1}
.mk.hi .halo{opacity:1}
.mk .halo{fill:none;stroke:var(--ink);stroke-width:2;opacity:0}
.layer{transition:opacity .2s}
svg[data-view="d1"] .layer.d2, svg[data-view="d1"] .layer.ov,
svg[data-view="d2"] .layer.d1, svg[data-view="d2"] .layer.ov,
svg[data-view="ov"] .layer.d1, svg[data-view="ov"] .layer.d2{opacity:.12}
.scale line{stroke:var(--ink);stroke-width:2}
.scale text,.north text{font:500 11px var(--f-mono);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px}
.north path{fill:var(--ink)}

/* shape keys */
.k{display:inline-block;width:14px;height:14px;flex:none}
.k.d1{background:var(--d1);border-radius:50%}
.k.d2{background:var(--d2);border-radius:3px}
.k.ov{width:11px;height:11px;background:var(--ov);transform:rotate(45deg);margin:1.5px}
.k.opt{border:2px dashed var(--muted);border-radius:50%;width:13px;height:13px}
.k.end{border:3px solid var(--ink);border-radius:50%}
.k.sp{width:22px;height:0;border-top:3px dashed var(--ov);margin-block:5.5px}

/* type markers */
.ty{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:var(--surface);vertical-align:-5px;margin-left:5px}
.ty svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tys{white-space:nowrap}
.tylegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 6px;font-size:13px;color:var(--muted)}
.tylegend span{display:inline-flex;align-items:center;gap:7px}
.tylegend .ty{margin:0}
ul.themes{list-style:none;margin:0 0 4px;padding:0;display:grid;gap:0}
ul.themes li{display:grid;grid-template-columns:auto 130px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
ul.themes .ty{margin:0;vertical-align:baseline}
ul.themes b{font:600 14px/1.3 var(--f-body)}

/* sections */
h2{display:flex;align-items:center;gap:10px;margin:34px 0 12px;font:700 clamp(1.25rem,2.4vw,1.6rem)/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
h2:first-child{margin-top:0}
.sect-note{margin:-4px 0 12px;color:var(--muted);font-size:14px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink);border-radius:8px;padding:12px 16px;margin:0 0 6px}
.warn h3{margin:0 0 6px;font:600 13px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.warn ul{margin:0;padding-left:18px}
.warn li{margin:4px 0}
.warn a{color:inherit}

table{width:100%;border-collapse:collapse;font-size:14px}
thead th{text-align:left;padding:8px 12px 8px 0;font:500 11.5px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--ink)}
tbody td{padding:14px 14px 14px 0;vertical-align:top;border-bottom:1px solid var(--line)}
tbody tr.row{cursor:pointer;transition:background .15s}
tbody tr.row.sel{background:var(--hl)}
td.c-seg{width:20%}
td.c-dist{width:12%;white-space:nowrap}
.from{font-weight:600;line-height:1.3}
.via{margin-top:3px;font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.muted{color:var(--muted)}
ul.items{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.items li{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:start}
ul.items.noicon li{grid-template-columns:1fr}
.note{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.bdg{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;font:500 12px/1 var(--f-mono);flex:none;margin-top:1px}
.bdg.d1{background:var(--d1);color:var(--on-d1);border-radius:50%}
.bdg.d2{background:var(--d2);color:var(--on-d2);border-radius:5px}
.bdg.opt{border:2px dashed var(--muted);border-radius:50%;color:var(--muted);width:20px;height:20px;margin:2px 1px}

.hotel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 28px}
.hotel{padding:14px 0;border-bottom:1px solid var(--line)}
.hname{font:600 16px/1.25 var(--f-display)}
.hnote{margin-top:4px;font-size:13.5px;color:var(--muted);line-height:1.45}
.hlinks{margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px}
.hlinks a.book{font-weight:600}
.hotels-in{display:grid;gap:10px}
.hotels-in .hotel{padding:0 0 10px;border-bottom:1px dashed var(--line)}
.hotels-in .hotel:last-child{border-bottom:0;padding-bottom:0}
td.c-town{width:22%}
.town{font:700 17px/1.2 var(--f-display)}
.tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:999px;background:var(--ink);color:var(--ground);font:500 11px/1.5 var(--f-mono);letter-spacing:.04em}
.budget{margin:10px 0 0;padding:10px 14px;border-left:3px solid var(--line);color:var(--muted);font-size:13.5px}
.foot{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.foot p{margin:4px 0}

/* narrow */
@media (max-width:980px){
  .layout{display:block}
  .mapwrap{position:static}
  .mapsvg{height:auto;width:100%;max-width:520px;aspect-ratio:541/900}
  .mapcol{margin-bottom:28px}
}
@media (max-width:720px){
  .glance>div,.glance>div+div{padding:12px 0;border-left:0}
  .glance>div+div{border-top:1px solid var(--line)}
  table,thead,tbody,tr,td{display:block}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  tbody tr{padding:14px 0;border-bottom:1px solid var(--line)}
  tbody td{border:0;padding:5px 0;width:auto!important;white-space:normal!important}
  tbody td[data-label]::before{content:attr(data-label);display:block;margin-bottom:3px;font:500 11px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  td.c-seg::before{display:none!important}
  ul.themes li{grid-template-columns:auto 1fr}
  ul.themes li>span:last-child{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* print */
@page{size:A4;margin:12mm}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --ground:#fff; --surface:#fff; --ink:#111; --muted:#4a4f4c; --line:#c9cfca;
    --sea:#D9E6EC; --land:#F9FAF6; --coast:#8EA7B1; --seaink:#54737F;
    --d1:#0E7C6B; --on-d1:#fff; --d2:#A65409; --on-d2:#fff; --ov:#7A3E9D; --on-ov:#fff;
    --link:#0B4F45; --hl:#fff; --warn-bg:#fff4e0; --warn-line:#e2b45a; --warn-ink:#4a3000;
  }
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff}
  body{font-size:10pt}
  .page{max-width:none;padding:0}
  .tools,.filters,.printbtn,.mapnote{display:none!important}
  .layout{display:block}
  .mapcol{break-after:page;page-break-after:always;margin:0}
  .mapwrap{position:static}
  .mapsvg{height:158mm;width:auto;margin:0 auto}
  svg[data-view] .layer{opacity:1!important}
  .sel-on .seg-d1,.sel-on .seg-d2,.sel-on .seg-sp,.sel-on .mk{opacity:1!important}
  h1{font-size:26pt}
  h2{break-after:avoid;page-break-after:avoid;margin-top:18px}
  tr,li,.hotel,.warn{break-inside:avoid;page-break-inside:avoid}
  tbody tr.row.sel{background:none}
  thead{display:table-header-group}
  a{color:var(--link)}
  table{font-size:9.5pt}
  .glance{margin-bottom:12px}
}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <p class="kicker" id="kicker"></p>
      <h1 id="h1">Inverness → Edinburgh</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Taal / Language">
        <button type="button" id="lang-nl" aria-pressed="true">NL</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="printbtn" id="printbtn" hidden></button>
    </div>
  </header>
  <section class="glance" id="glance"></section>
  <div class="layout">
    <aside class="mapcol">
      <div class="mapwrap">
        <div class="filters" id="filters" role="group"></div>
        <svg id="map" class="mapsvg" role="img" viewBox="0 0 541 900" data-view="all" aria-label="Kaart"></svg>
        <div class="legend" id="legend"></div>
        <p class="mapnote" id="mapnote"></p>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>

    hotels:[ { name:I('The Fortingall','The Fortingall'), book:BKS('The Fortingall Hotel, Fortingall, Aberfeldy'), bookSearch:true, map:GM('The Fortingall, Fortingall, Aberfeldy'), site:'https://www.fortingall.com/',
      note:I('Staat op Booking.com (66 geverifieerde beoordelingen; score niet gecontroleerd). Direct boeken kan ook via de website of 01887 830 367.','Listed on Booking.com (66 verified reviews; score not checked). You can also book direct via the website or +44 1887 830 367.') } ] },
];

/* ---------- map markers ---------- */
const MK = [
  { id:'cul',  k:'d1', n:1, layer:'d1', label:'Culloden',      dx:0,   dy:27, a:'middle' },
  { id:'elg',  k:'d1', n:2, layer:'d1', label:'Elgin',         dx:0,   dy:-18, a:'middle' },
  { id:'crai', k:'opt',layer:'d1', label:'Cooperage',         dx:0,   dy:24, a:'middle' },
  { id:'gra',  k:'ov', layer:'ov', label:'Grantown',          dx:-14, dy:5,  a:'end' },
  { id:'avi',  k:'ov', layer:'ov', label:'Aviemore',          dx:-14, dy:5,  a:'end' },
  { id:'kin',  k:'ov', layer:'ov', label:'Kingussie',         dx:-14, dy:5,  a:'end', ox:-6, oy:-8 },
  { id:'pit',  k:'ov', layer:'ov', label:'Pitlochry',         dx:14,  dy:5,  a:'start' },
  { id:'fort', k:'ov', layer:'ov', label:'Fortingall',        dx:-14, dy:5,  a:'end' },
  { id:'ruth', k:'d2', n:1, layer:'d2', label:'Ruthven',       dx:17,  dy:6,  a:'start', ox:12, oy:14 },
  { id:'loch', k:'opt',layer:'d2', label:'Loch an Eilein',    dx:12,  dy:5,  a:'start', ox:6, oy:9 },
  { id:'bruar',k:'d2', n:2, layer:'d2', label:'Bruar',         dx:-21, dy:5,  a:'end' },
  { id:'blair',k:'d2', n:3, layer:'d2', label:'Blair Castle',  dx:17,  dy:5,  a:'start' },
  { id:'herm', k:'d2', n:4, layer:'d2', label:'Hermitage',     dx:17,  dy:5,  a:'start' },
  { id:'scone',k:'d2', n:5, layer:'d2', label:'Scone Palace',  dx:17,  dy:5,  a:'start' },
  { id:'lochl',k:'d2', n:6, layer:'d2', label:'Lochleven',     dx:17,  dy:5,  a:'start' },
  { id:'qf',   k:'d2', n:7, layer:'d2', label:'Queensferry',   dx:-17, dy:5,  a:'end' },
  { id:'inv',  k:'end',layer:'d1', label:'Inverness',         dx:-13, dy:5,  a:'end', big:true },
  { id:'edi',  k:'end',layer:'d2', label:'Edinburgh',         dx:0,   dy:29, a:'middle', big:true },
];
const SEGCLS = { s1:'d1', s2:'d1', s3:'d1', s4:'d1', s4b:'d2', s5:'d2', s6:'d2', s7:'d2', s8:'d2', s9a:'d2', s9b:'d2' };

/* ---------- state ---------- */
let view = 'all';
let sel = null; // { segs:[], stops:[] }

const el = id => document.getElementById(id);
const pick = o => (o && typeof o === 'object' && 'nl' in o) ? o[lang] : o;
const fmtHM = m => { const h = Math.floor(m/60), r = m % 60; const u = UI[lang]; return h ? `${h} ${u.h}${r ? ' ' + String(r).padStart(2,'0') : ''}` : `${r} ${u.min}`; };

/* ---------- render: map ---------- */
function renderMap(){
  const u = UI[lang], P = GEO.pts, L = GEO.labels;
  const svg = el('map');
  svg.setAttribute('aria-label', u.mapLabel);
  svg.setAttribute('viewBox', `0 0 ${GEO.W} ${GEO.H}`);
  let s = `<rect class="sea" width="${GEO.W}" height="${GEO.H}"/><path class="land" d="${GEO.coast}"/><path class="ness" d="${GEO.ness}"/>`;
  s += `<text class="seaTxt" x="${L.moray[0]}" y="${L.moray[1]}" text-anchor="middle">Moray Firth</text>`;
  s += `<text class="seaTxt" x="${GEO.W-14}" y="${L.forth[1]}" text-anchor="end">Firth of Forth</text>`;
  s += `<text class="seaTxt" x="${L.ness[0]}" y="${L.ness[1]}" text-anchor="middle" transform="rotate(-52 ${L.ness[0]} ${L.ness[1]})">Loch Ness</text>`;
  s += `<text class="regTxt" x="${L.speyside[0]}" y="${L.speyside[1]}" text-anchor="middle">SPEYSIDE</text>`;
  s += `<text class="regTxt" x="${GEO.W-24}" y="${L.cairngorms[1]-22}" text-anchor="end">CAIRNGORMS</text>`;
  s += `<text class="regTxt" x="${L.perthshire[0]}" y="${L.perthshire[1]}" text-anchor="middle">PERTHSHIRE</text>`;
  s += `<text class="regTxt" x="${GEO.W-20}" y="${L.fife[1]}" text-anchor="end">FIFE</text>`;
  // segments
  for (const day of ['d1','d2']) {
    s += `<g class="layer ${day}">`;
    for (const [id, cls] of Object.entries(SEGCLS)) if (cls === day) {
      s += `<path class="casing" d="${GEO.segs[id]}"/><path class="seg-${day}" data-seg="${id}" d="${GEO.segs[id]}"/><path class="seg-hit" data-seg="${id}" d="${GEO.segs[id]}"/>`;
    }
    s += `</g>`;
  }
  s += `<g class="layer ov"><path class="casing" d="${GEO.segs.sf}"/><path class="seg-sp" data-seg="sf" d="${GEO.segs.sf}"/><path class="seg-hit" data-seg="sf" d="${GEO.segs.sf}"/></g>`;
  // markers
  for (const layer of ['d1','d2','ov']) {
    s += `<g class="layer ${layer}">`;
    for (const m of MK.filter(m => m.layer === layer)) {
      const x = P[m.id][0] + (m.ox||0), y = P[m.id][1] + (m.oy||0);
      let shape = '';
      if (m.k === 'd1') shape = `<circle class="halo" r="16"/><circle class="ring" r="12.5"/><circle class="shape-d1" r="11"/><text class="num d1">${m.n}</text>`;
      if (m.k === 'd2') shape = `<rect class="halo" x="-15" y="-15" width="30" height="30" rx="7"/><rect class="ring" x="-12.5" y="-12.5" width="25" height="25" rx="6"/><rect class="shape-d2" x="-11" y="-11" width="22" height="22" rx="5"/><text class="num d2">${m.n}</text>`;
      if (m.k === 'ov') shape = `<rect class="halo" x="-13" y="-13" width="26" height="26" transform="rotate(45)"/><rect class="ring" x="-10.5" y="-10.5" width="21" height="21" transform="rotate(45)"/><rect class="shape-ov" x="-9" y="-9" width="18" height="18" transform="rotate(45)"/>`;
      if (m.k === 'opt') shape = `<circle class="opt-shape" r="6.5"/>`;
      if (m.k === 'end') shape = `<circle class="end" r="7"/>`;
      const label = `<text class="lbl2${m.k==='opt'?' opt':''}${m.big?' big':''}" x="${m.dx}" y="${m.dy}" text-anchor="${m.a}">${m.label}</text>`;
      const interactive = m.k !== 'end';
      s += `<g class="mk" data-stop="${m.id}" transform="translate(${x} ${y})"${interactive ? ' role="button" tabindex="0"' : ''} aria-label="${m.label}">${shape}${label}</g>`;
    }
    s += `</g>`;
  }
  // scale + north
  s += `<g class="scale" transform="translate(16 ${GEO.H-26})"><line x1="0" y1="0" x2="${GEO.scalePx}" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/><line x1="${GEO.scalePx}" y1="-5" x2="${GEO.scalePx}" y2="5"/><text x="0" y="-9">${u.scale}</text></g>`;
  s += `<g class="north" transform="translate(${GEO.W-26} 30)"><path d="M0 -14 L6 6 L0 2 L-6 6 Z"/><text x="0" y="22" text-anchor="middle">N</text></g>`;
  svg.innerHTML = s;
  svg.dataset.view = view;
  applySel();
}

/* ---------- render: chrome ---------- */
function renderChrome(){
  const u = UI[lang];
  document.documentElement.lang = lang;
  el('kicker').textContent = u.kicker;
  el('sub').textContent = u.sub;
  el('lang-nl').setAttribute('aria-pressed', lang === 'nl');
  el('lang-en').setAttribute('aria-pressed', lang === 'en');
  const pb = el('printbtn'); pb.hidden = !STANDALONE; pb.textContent = u.print;
  const sum = rows => rows.reduce((a, r) => ({ mi:a.mi+r.mi, km:a.km+r.km, min:a.min+r.min }), { mi:0, km:0, min:0 });
  const a = sum(DAY1), b = sum(DAY2);
  const t = { mi:a.mi+b.mi, km:a.km+b.km, min:a.min+b.min };
  const drv = (lbl, cls, o, s) => `<div><div class="lbl">${cls ? `<span class="k ${cls}"></span>` : ''}${lbl}</div><div class="val">${o.mi} mi · ${o.km} km<small>≈ ${fmtHM(o.min)} ${u.drive}${s ? ' · ' + s : ''}</small></div></div>`;
  el('glance').setAttribute('aria-label', u.glance);
  el('glance').innerHTML =
    `<div><div class="lbl"><span class="k end"></span>${u.gThu}</div><div class="val">${u.gThuV}<small>${u.gThuS}</small></div></div>` +
    drv(u.gFri, 'd1', a, u.friS) + drv(u.gSat, 'd2', b, u.satS) +
    `<div><div class="lbl"><span class="k end"></span>${u.gSun}</div><div class="val">${u.gSunV}<small>${u.gSunS}</small></div></div>` +
    drv(u.gTot, '', t, '');
  const f = u.filt;
  const chips = [['all',f.all,''],['d1',f.d1,'d1'],['ov',f.ov,'ov'],['d2',f.d2,'d2']];
  const fe = el('filters'); fe.setAttribute('aria-label', u.filtLabel);
  fe.innerHTML = chips.map(([v, l, k]) => `<button type="button" class="chip" data-view="${v}" aria-pressed="${view===v}">${k ? `<span class="k ${k}"></span>` : ''}${l}</button>`).join('');
  const lg = u.leg;
  el('legend').innerHTML = `<span><i class="k d1"></i>${lg.d1}</span><span><i class="k d2"></i>${lg.d2}</span><span><i class="k ov"></i>${lg.ov}</span><span><i class="k sp"></i>${lg.sp}</span><span><i class="k opt"></i>${lg.opt}</span><span><i class="k end"></i>${lg.end}</span>`;
  el('mapnote').textContent = u.mapNote;
}

/* ---------- render: content ---------- */
function stopsHTML(stops, kind){
  const u = UI[lang];
  return `<ul class="items">` + stops.map(s => {
    const name = pick(s.name);
    const bd = s.opt ? `<span class="bdg opt" title="${u.opt}" aria-label="${u.opt}">+</span>` : `<span class="bdg ${kind}" aria-label="${u.stop} ${s.n}">${s.n}</span>`;
    return `<li>${bd}<span>${A(name, s.url)}${tysHTML(s.ty)}<span class="note">${pick(s.note)}</span></span></li>`;
  }).join('') + `</ul>`;
}
function eatHTML(eat){
  if (!eat.length) return '<span class="muted">—</span>';
  return `<ul class="items noicon">` + eat.map(e => `<li><span>${A(pick(e.name), e.url)}${tysHTML(e.ty)}<span class="note">${pick(e.note)}</span></span></li>`).join('') + `</ul>`;
}
function dayTable(rows, kind){
  const u = UI[lang];
  return `<table><thead><tr><th>${u.th.seg}</th><th>${u.th.dist}</th><th>${u.th.hl}</th><th>${u.th.eat}</th></tr></thead><tbody>` +
    rows.map(r => {
      const stopIds = r.stops.filter(s => s.id).map(s => s.id).join(' ');
      return `<tr class="row" data-segs="${r.segs.join(' ')}" data-stops="${stopIds}">
        <td class="c-seg"><div class="from">${pick(r.from)}</div><div class="via">${pick(r.via)}</div></td>
        <td class="c-dist" data-label="${u.th.dist}"><div class="mono">${r.mi} mi · ${r.km} km</div><div class="mono muted">${fmtHM(r.min)}</div></td>
        <td data-label="${u.th.hl}">${stopsHTML(r.stops, kind)}</td>
        <td data-label="${u.th.eat}">${eatHTML(r.eat)}</td></tr>`;
    }).join('') + `</tbody></table>`;
}
function hotelHTML(h){
  const u = UI[lang];
  const links = [
    A(h.bookSearch ? u.bookSearch : u.booking, h.book, 'book'),
    A(u.map, h.map),
    h.site ? A(u.site, h.site) : ''
  ].filter(Boolean).join(' ');
  const note = h.note ? pick(h.note) : '';
  return `<div class="hotel"><div class="hname">${pick(h.name)}</div>${note ? `<div class="hnote">${note}</div>` : ''}<div class="hlinks">${links}</div></div>`;
}
function overnightTable(){
  const u = UI[lang];
  return `<table><thead><tr><th>${u.th.town}</th><th>${u.th.why}</th><th>${u.th.hotels}</th></tr></thead><tbody>` +
    OVERNIGHT.map(o => `<tr class="row" data-segs="${o.segs.join(' ')}" data-stops="${o.id}">
      <td class="c-town"><div class="town">${o.town}${tysHTML(o.ty)}</div><span class="tag">${pick(o.tag)}</span></td>
      <td data-label="${u.th.why}">${pick(o.why)}</td>
      <td data-label="${u.th.hotels}"><div class="hotels-in">${o.hotels.map(hotelHTML).join('')}</div></td></tr>`).join('') + `</tbody></table>`;
}
function tyLegend(){
  return `<div class="tylegend">${Object.keys(TYPES).map(t => `<span>${tyIcon(t)}${TYPES[t][lang]}</span>`).join('')}</div>`;
}
function themesHTML(){
  return `<ul class="themes">${THEMES.map(x => `<li>${tyIcon(x.t)}<b>${TYPES[x.t][lang]}</b><span>${pick(x.txt)}</span></li>`).join('')}</ul>`;
}
function h2(kind, text){ return `<h2><span class="k ${kind}"></span>${text}</h2>`; }
function renderContent(){
  const u = UI[lang];
  el('content').innerHTML =
    `<div class="warn"><h3>${u.warnH}</h3><ul>${WARN.map(w => `<li>${pick(w)}</li>`).join('')}</ul></div>` +
    h2('end', u.themesH) + tyLegend() + themesHTML() +
    h2('end', u.startH) + `<p class="sect-note">${u.startSub}</p><div class="hotel-grid">${HOTELS_INV.map(hotelHTML).join('')}</div>` +
    h2('d1', u.d1H) + dayTable(DAY1, 'd1') + `<p class="budget">${pick(BUDGET.d1)}</p>` +
    h2('ov', u.ovH) + `<p class="sect-note">${u.ovSub}</p>` + overnightTable() +
    h2('d2', u.d2H) + dayTable(DAY2, 'd2') + `<p class="budget">${pick(BUDGET.d2)}</p>` +
    h2('end', u.endH) + `<p class="sect-note">${u.endSub}</p><div class="hotel-grid">${HOTELS_EDI.map(hotelHTML).join('')}</div>` +
    `<div class="foot"><p>${u.footChecked}</p><p>${u.footLinks}</p></div>`;
  applySel();
}

/* ---------- selection ---------- */
function applySel(){
  const svg = el('map');
  svg.classList.toggle('sel-on', !!sel);
  svg.querySelectorAll('[data-seg]').forEach(p => p.classList.toggle('hi', !!sel && sel.segs.includes(p.dataset.seg)));
  svg.querySelectorAll('.mk').forEach(m => m.classList.toggle('hi', !!sel && sel.stops.includes(m.dataset.stop)));
  document.querySelectorAll('tr.row').forEach(r => {
    const segs = (r.dataset.segs || '').split(' ').filter(Boolean), stops = (r.dataset.stops || '').split(' ').filter(Boolean);
    const on = !!sel && (segs.some(s => sel.segs.includes(s)) || stops.some(s => sel.stops.includes(s)));
    r.classList.toggle('sel', on);
  });
}
const parts = v => (v || '').split(' ').filter(Boolean);
function selectRow(r){
  const segs = parts(r.dataset.segs), stops = parts(r.dataset.stops);
  const same = sel && JSON.stringify(sel.segs) === JSON.stringify(segs) && JSON.stringify(sel.stops) === JSON.stringify(stops);
  sel = same ? null : { segs, stops };
  applySel();
}
function scrollToRow(r){
  const rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  r.scrollIntoView({ block:'center', behavior: rm ? 'auto' : 'smooth' });
}
function selectStop(id){
  const r = [...document.querySelectorAll('tr.row')].find(r => parts(r.dataset.stops).includes(id));
  if (!r) return;
  sel = { segs:parts(r.dataset.segs), stops:parts(r.dataset.stops) };
  applySel(); scrollToRow(r);
}
function selectSeg(id){
  const r = [...document.querySelectorAll('tr.row')].find(r => parts(r.dataset.segs).includes(id));
  if (!r) return;
  sel = { segs:parts(r.dataset.segs), stops:parts(r.dataset.stops) };
  applySel(); scrollToRow(r);
}

/* ---------- events ---------- */
function setLang(l){
  lang = l; LS.set('ie-lang', l);
  renderChrome(); renderMap(); renderContent();
}
el('lang-nl').addEventListener('click', () => setLang('nl'));
el('lang-en').addEventListener('click', () => setLang('en'));
el('printbtn').addEventListener('click', () => window.print());
el('filters').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  view = b.dataset.view;
  el('map').dataset.view = view;
  el('filters').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.view === view));
});
el('map').addEventListener('click', e => {
  const seg = e.target.closest('[data-seg]'); const mk = e.target.closest('.mk');
  if (mk && mk.getAttribute('role') === 'button') selectStop(mk.dataset.stop);
  else if (seg) selectSeg(seg.dataset.seg);
});
el('map').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const mk = e.target.closest('.mk'); if (mk && mk.getAttribute('role') === 'button'){ e.preventDefault(); selectStop(mk.dataset.stop); }
});
el('content').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const r = e.target.closest('tr.row'); if (r) selectRow(r);
});

/* ---------- boot ---------- */
(function(){
  let l = null;
  try { const h = (location.hash || '').replace('#',''); if (h === 'en' || h === 'nl') l = h; } catch(e){}
  if (!l) { const s = LS.get('ie-lang'); if (s === 'en' || s === 'nl') l = s; }
  lang = l || 'nl';
  renderChrome(); renderMap(); renderContent();
})();
</script>

</body>
</html>
